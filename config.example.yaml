app:
  mfa_provider: webui
  watch_with_interval: 3600

all_users:
  directory: /data
  # Library on a network mount (NFS)? Keep the state database on local disk,
  # and refuse to run if the mount drops (see README, "Library on a network mount").
  # state_directory: /state
  # require_mount_marker: true

users:
  - username: you@icloud.com
    password_file: /run/secrets/icloud_password_you
  - username: partner@icloud.com
    password_file: /run/secrets/icloud_password_partner
    directory: /data/account2
